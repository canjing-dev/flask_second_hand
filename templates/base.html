<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆心二手交易平台</title>
    <!-- 引入 Bootstrap 5 的漂亮样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .card { transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href=" ">圆心二手</a >
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav align-items-center">
                    {% if session.get('user_id') %}
                        <li class="nav-item me-3">
                            <span class="navbar-text text-white">欢迎你，{{ session.get('phone') }}</span>
                        </li>
                        <li class="nav-item me-2">
                            <a class="btn btn-light btn-sm fw-bold text-primary" href="/upload">+ 发布商品</a >
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a >
                        </li>
                    {% else %}
                        <li class="nav-item me-2">
                            <a class="btn btn-outline-light btn-sm" href="/login">登录</a >
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-light btn-sm fw-bold text-primary" href="/register">注册</a >
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面具体内容填充区 -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
