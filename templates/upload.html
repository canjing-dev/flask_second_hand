{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4">
                <h3 class="text-center fw-bold mb-4">发布闲置好物</h3>
                <!-- 注意 enctype，这是上传文件必须的 -->
                <form action="/upload" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label text-muted">商品名称</label>
                        <input type="text" name="name" class="form-control" placeholder="例如：自用哑铃，九成新" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">价格 (￥)</label>
                        <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">商品图片 (可选)</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">立即上架</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
