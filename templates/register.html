{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4">
                <h3 class="text-center fw-bold mb-4">账号注册</h3>
                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted">手机号</label>
                        <input type="text" name="phone" class="form-control" placeholder="请输入手机号" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">密码</label>
                        <input type="password" name="pwd" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">注册</button>
                </form>
                <div class="text-center mt-3">
                    <small>已有账号?<a href="login">去登录</a ></small>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
